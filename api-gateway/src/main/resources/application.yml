server:
  port: 8081

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: USER-SERVICE
              uri: http://localhost:8082
              predicates:
                - Path=/api/**

app:
  rate-limit:
    free: 10
    pro: 100
    enterprise: 1000