server:
  port: 8081

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # ==========================
            # USER SERVICE
            # ==========================
            - id: USER-SERVICE
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**

            # ==========================
            # INGESTION SERVICE
            # ==========================
            - id: INGESTION-SERVICE
              uri: lb://ingestion-service
              predicates:
                - Path=/api/v1/ingestion/**

app:
  rate-limit:
    free: 10
    pro: 100
    enterprise: 1000

  jwt:
    secret: 8f5b8d3c4a7e9f126ab73cd5e81a9b4f8d72a4e0f13c65b9e4d2f1c8a7b6d5e9
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true