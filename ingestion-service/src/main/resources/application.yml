server:
    port: 8083

spring:
  application:
    name: ingestion-service

  datasource:
    url: jdbc:postgresql://localhost:5456/clauseiq
    username: root
    password: postgres
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
            model: text-embedding-3-small

  vectorstore:
    pgvector:
      initialize-schema: false
      dimensions: 1536
      distance-type: COSINE_DISTANCE

  jpa:
      hibernate:
          ddl-auto: validate
      show-sql: true

  servlet:
      multipart:
          max-file-size: 20MB
          max-request-size: 20MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.clauseiq.ingestion: DEBUG

