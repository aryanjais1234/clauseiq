server:
    port: 8083

spring:
  application:
    name: ingestion-service

  datasource:
    url: jdbc:postgresql://localhost:5456/clauseiq
    username: root
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
      hibernate:
          ddl-auto: validate
      show-sql: true

  servlet:
      multipart:
          max-file-size: 20MB
          max-request-size: 20MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

